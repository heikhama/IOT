<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='graph.js') }}" defer></script>
    <style>
        .btn-save {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background: linear-gradient(to bottom, #4CAF50 0%, #2E7D32 100%);
            border: none;
            border-radius: 8px;
            box-shadow: 0 5px #1B5E20;
            cursor: pointer;
        }

        .btn-save:active {
            box-shadow: 0 2px #1B5E20;
            transform: translateY(3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Live System Monitor</h2>
        <label>Temperature:</label>
        <input id="temp" readonly> °C<br>
        <label>Power Usage:</label>
        <input id="power" readonly> Watts<br>
        <canvas id="graph" width="500" height="200"></canvas><br>
        <button class="btn-save" onclick="saveData()">💾 Save Data</button>
    </div>

    <script>
        function saveData() {
            const temperature = document.getElementById('temp').value;
            const power = document.getElementById('power').value;
            const timestamp = new Date().toLocaleString();

            fetch('/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ temperature, power, timestamp })
            }).then(response => {
                if (response.ok) {
                    //alert("Data saved successfully!");
                } else {
                    alert("Failed to save data.");
                }
            });
        }
        // Auto-save every 1 minute (60,000 ms)
        setInterval(saveData, 1000); // <-- This is the key addition
    </script>
</body>
</html>
