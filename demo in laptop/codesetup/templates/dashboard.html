<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='graph.js') }}" defer></script>
    
</head>
<body>
    <div class="container">
        <h2>Live System Monitor</h2>
        <label>Temperature:</label>
        <input id="temp" readonly> °C<br>
        <label>Power Usage:</label>
        <input id="power" readonly> Watts<br>
        <canvas id="graph" width="500" height="200"></canvas><br>
        <button class="btn-save" onclick="saveData()">💾 Save Data</button>
    </div>

    <script>
        function saveData() {
            const temperature = document.getElementById('temp').value;
            const power = document.getElementById('power').value;
            const timestamp = new Date().toLocaleString();

            fetch('/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ temperature, power, timestamp })
            }).then(response => {
                if (response.ok) {
                    //alert("Data saved successfully!");
                } else {
                    alert("Failed to save data.");
                }
            });
        }
        // Auto-save every 1 minute (60,000 ms)
        setInterval(saveData, 1000); // <-- This is the key addition
    </script>
</body>
</html>
