<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form method="POST" action="/do_login" autocomplete="off">
            <input name="username" placeholder="Username" required autocomplete="off"><br>
            <input name="password" type="password" placeholder="Password" required autocomplete="new-password"><br>
            <button class="btn-save" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
